name: Bug report
description: Report a reproducible verifier, schema or conformance problem.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private records or exploitable vulnerability details. Follow SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: GOVP version
      placeholder: 0.1.10
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include commands and a record using reserved example data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, personal data, customer data and private keys.
          required: true
