name: agent-record-offline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/agent-record-offline.yml
      - tools/check_agent_record_offline.py
      - tools/agent-record-offline-requirements.txt
      - tests/test_agent_record_offline.py
      - examples/agent-record/**
      - docs/agent-record.md
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-record-offline.yml
      - tools/check_agent_record_offline.py
      - tools/agent-record-offline-requirements.txt
      - tests/test_agent_record_offline.py
      - examples/agent-record/**
      - docs/agent-record.md

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Prepare hash-pinned public wheels while online
        run: >-
          python -m pip download --only-binary=:all: --require-hashes
          --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64
          --python-version 3.12 --implementation cp --abi cp312 --abi abi3
          -r tools/agent-record-offline-requirements.txt
          --dest "$RUNNER_TEMP/agent-record-wheels"
      - name: Install and verify with no external network
        run: python tools/check_agent_record_offline.py --wheels "$RUNNER_TEMP/agent-record-wheels"
