name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -U pip
      - run: python -m pip install -c requirements-release.txt -r requirements-test.txt .
      - run: pytest --strict-config --strict-markers
      - run: govp self-test
      - run: govp verify examples/manufacturing-record.govp.txt --asset examples/manufacturing-record.statement.txt

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install -c requirements-release.txt -r requirements-test.txt .
      - run: ruff check .
      - run: mypy --check-untyped-defs src
      - run: bandit -q -r src packaging
      - run: pip-audit -r requirements-release.txt --progress-spinner=off

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate machine-readable contracts
        run: |
          python -m json.tool conformance/vectors.json >/dev/null
          python -m json.tool conformance/json-vectors.json >/dev/null
          python -m json.tool schema/govp-1.schema.json >/dev/null
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          package = pathlib.Path("src/govp/__init__.py").read_text()
          assert f'__version__ = "{project["project"]["version"]}"' in package
          PY
      - name: Build and inspect distributions
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-release.txt
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Test the built wheel in isolation
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/govp self-test
          wheel-test/bin/govp verify examples/manufacturing-record.govp.txt \
            --asset examples/manufacturing-record.statement.txt
