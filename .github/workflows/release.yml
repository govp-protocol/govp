name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed release tag"
        required: true
        default: "v0.1.13"
        type: string
      confirmation:
        description: "Type release-govp to authorize immutable publication"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    if: inputs.confirmation == 'release-govp'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Require a GitHub-verified annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          object_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)"
          object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          test "$object_type" = "tag"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq .verification.verified)" = "true"
      - name: Verify release version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          runtime="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' src/govp/__init__.py)"
          test "$RELEASE_TAG" = "v$version"
          test "$runtime" = "$version"
      - name: Build Python distributions with the reviewed toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build --no-isolation
          python -m twine check dist/*
          version="${RELEASE_TAG#v}"
          git archive --format=zip --prefix="GOVP-$version/" --output="dist/GOVP-$version-source.zip" HEAD
          cp LICENSE NOTICE LICENSE-HISTORY.md TRADEMARKS.md DEPENDENCY-LICENSES.md THIRD_PARTY_NOTICES.md dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/GOVP-*-source.zip
            dist/LICENSE
            dist/NOTICE
            dist/LICENSE-HISTORY.md
            dist/TRADEMARKS.md
            dist/DEPENDENCY-LICENSES.md
            dist/THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  binary:
    if: inputs.confirmation == 'release-govp'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: govp-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: govp-linux-arm64
          - os: macos-15-intel
            artifact: govp-macos-x86_64
          - os: macos-14
            artifact: govp-macos-arm64
          - os: windows-latest
            artifact: govp-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements-release.txt -r requirements-test.txt
      - run: python -m pip install --no-build-isolation .
      - run: pytest
      - run: pyinstaller --onefile --collect-data govp --name govp packaging/entry.py
      - name: Test the standalone binary
        shell: bash
        run: |
          if [ -f dist/govp.exe ]; then
            dist/govp.exe self-test
            dist/govp.exe conformance --run
            dist/govp.exe publication-conformance --run
            dist/govp.exe examples --extract govp-examples
          else
            dist/govp self-test
            dist/govp conformance --run
            dist/govp publication-conformance --run
            dist/govp examples --extract govp-examples
          fi
      - name: Verify HTTPS from the standalone binary
        shell: bash
        run: |
          if [ -f dist/govp.exe ]; then
            dist/govp.exe verify-url https://govp.io/.well-known/govp.txt
          else
            dist/govp verify-url https://govp.io/.well-known/govp.txt
          fi
      - name: Rename binary
        shell: bash
        run: |
          if [ -f dist/govp.exe ]; then
            mv dist/govp.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/govp "dist/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish:
    if: inputs.confirmation == 'release-govp'
    needs: [package, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: >-
          sha256sum GOVP-* govp-* LICENSE NOTICE TRADEMARKS.md
          LICENSE-HISTORY.md DEPENDENCY-LICENSES.md THIRD_PARTY_NOTICES.md > SHA256SUMS
      - name: Create complete draft, then publish immutably
        run: |
          version="${RELEASE_TAG#v}"
          release_assets=(
            release/GOVP-*
            release/govp-*
            release/LICENSE
            release/NOTICE
            release/LICENSE-HISTORY.md
            release/TRADEMARKS.md
            release/DEPENDENCY-LICENSES.md
            release/THIRD_PARTY_NOTICES.md
            release/SHA256SUMS
          )
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "GOVP $version" "${release_assets[@]}"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          for attempt in {1..12}; do
            if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "Release attestation is not visible yet (attempt $attempt/12); retrying in 5 seconds."
            sleep 5
          done
          echo "Release attestation did not become visible within 60 seconds." >&2
          exit 1
