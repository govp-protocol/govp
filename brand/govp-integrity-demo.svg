<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GOVP detects a modified artifact</title>
  <desc id="desc">The original synthetic artifact passes every local check. A copy with one changed line keeps the signed record valid but fails the asset SHA-256 check.</desc>
  <rect width="1200" height="360" rx="24" fill="#F6F8FC"/>
  <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360" stroke="#DDE5F0" stroke-width="1" opacity=".55"/>
  <g font-family="Inter, IBM Plex Sans, Arial, sans-serif">
    <g transform="translate(54 48)">
      <rect width="510" height="264" rx="20" fill="#FFFFFF" stroke="#CED8E6" stroke-width="2"/>
      <text x="30" y="42" fill="#3E7BFA" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" letter-spacing="2">ORIGINAL ARTIFACT</text>
      <circle cx="44" cy="91" r="13" fill="#22C7E5"/>
      <path d="M66 91H446" stroke="#3E7BFA" stroke-width="5" stroke-linecap="round"/>
      <circle cx="466" cy="91" r="13" fill="#22C7E5"/>
      <text x="30" y="143" fill="#07182C" font-size="27" font-weight="750">GOVP verification: VALID</text>
      <text x="30" y="184" fill="#607086" font-family="IBM Plex Mono, monospace" font-size="16">signature    pass</text>
      <text x="30" y="214" fill="#607086" font-family="IBM Plex Mono, monospace" font-size="16">asset        pass</text>
      <rect x="333" y="170" width="145" height="58" rx="12" fill="#E9FBFE"/>
      <text x="405" y="205" text-anchor="middle" fill="#087E93" font-size="17" font-weight="750">EXACT BYTES</text>
    </g>
    <g transform="translate(636 48)">
      <rect width="510" height="264" rx="20" fill="#FFFFFF" stroke="#E6C8CA" stroke-width="2"/>
      <text x="30" y="42" fill="#B4232A" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" letter-spacing="2">ONE LINE CHANGED</text>
      <circle cx="44" cy="91" r="13" fill="#22C7E5"/>
      <path d="M66 91H246M274 91H446" stroke="#3E7BFA" stroke-width="5" stroke-linecap="round"/>
      <path d="M248 77L271 104M272 77L249 104" stroke="#E5484D" stroke-width="6" stroke-linecap="round"/>
      <circle cx="466" cy="91" r="13" fill="#E5484D"/>
      <text x="30" y="143" fill="#8D151B" font-size="27" font-weight="750">GOVP verification: INVALID</text>
      <text x="30" y="184" fill="#607086" font-family="IBM Plex Mono, monospace" font-size="16">signature    pass</text>
      <text x="30" y="214" fill="#B4232A" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700">asset        FAIL</text>
      <rect x="294" y="170" width="184" height="58" rx="12" fill="#FDEBEC"/>
      <text x="386" y="194" text-anchor="middle" fill="#B4232A" font-size="15" font-weight="750">BROKEN BINDING</text>
      <text x="386" y="215" text-anchor="middle" fill="#8D151B" font-size="13">SHA-256 mismatch</text>
    </g>
  </g>
</svg>
